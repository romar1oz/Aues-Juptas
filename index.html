<!DOCTYPE html>
<html lang="ru" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#070A12" />
    <title>JUPTAS</title>
    <link rel="icon" type="image/svg+xml" href="logo.svg" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@500;700&display=swap"
      rel="stylesheet"
    />

    <!-- Тема применяется до отрисовки, чтобы не было «вспышки» -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("cl_theme");
          if (!t) t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
          document.documentElement.setAttribute("data-theme", t);
        } catch (e) {}
      })();
    </script>

    <style>
      /* ================= ТЕМЫ ================= */
      :root {
        --font: "Manrope", system-ui, -apple-system, sans-serif;
        --display: "Unbounded", "Manrope", sans-serif;
        --love: #e8577e;
        --friends: #3aa8dc;
        --study: #8a73f5;
        --team: #2fbf8a;
        --r: 18px;
      }
      [data-theme="dark"] {
        --bg: #070a12;
        --glow: rgba(217, 180, 126, 0.12);
        --panel: #0e1322;
        --panel-2: #141a2c;
        --elev: #1a2136;
        --text: #f2f4f8;
        --muted: #97a1b8;
        --line: rgba(255, 255, 255, 0.08);
        --line-2: rgba(255, 255, 255, 0.16);
        --accent: #d9b47e;
        --accent-2: #b98f55;
        --on-accent: #0b0e16;
        --accent-soft: rgba(217, 180, 126, 0.14);
        --danger: #f0667a;
        --danger-soft: rgba(240, 102, 122, 0.14);
        --ok: #3ccb94;
        --ok-soft: rgba(60, 203, 148, 0.14);
        --overlay: rgba(4, 6, 12, 0.72);
        --shadow: 0 24px 70px rgba(0, 0, 0, 0.55);
        --input: rgba(255, 255, 255, 0.04);
      }
      [data-theme="light"] {
        --bg: #f4f1ea;
        --glow: rgba(185, 143, 85, 0.16);
        --panel: #ffffff;
        --panel-2: #f8f6f1;
        --elev: #ffffff;
        --text: #1b1e27;
        --muted: #6a7180;
        --line: rgba(20, 20, 30, 0.09);
        --line-2: rgba(20, 20, 30, 0.18);
        --accent: #b4844a;
        --accent-2: #94693a;
        --on-accent: #ffffff;
        --accent-soft: rgba(180, 132, 74, 0.12);
        --danger: #d63e54;
        --danger-soft: rgba(214, 62, 84, 0.1);
        --ok: #1f9d6e;
        --ok-soft: rgba(31, 157, 110, 0.12);
        --overlay: rgba(20, 22, 30, 0.45);
        --shadow: 0 20px 50px rgba(40, 30, 10, 0.14);
        --input: rgba(20, 20, 30, 0.035);
      }

      /* ================= БАЗА ================= */
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      [hidden] { display: none !important; }
      html, body { margin: 0; height: 100%; }
      body {
        background: var(--bg);
        color: var(--text);
        font-family: var(--font);
        font-size: 14px;
        display: flex;
        justify-content: center;
        overflow: hidden;
        transition: background 0.25s, color 0.25s;
      }
      button, input, select, textarea { font: inherit; color: inherit; }
      button { cursor: pointer; border: 0; background: none; }
      button:disabled { cursor: default; opacity: 0.4; }
      a { color: inherit; }
      .bg-glow {
        position: fixed; top: -160px; left: 50%; transform: translateX(-50%);
        width: 620px; height: 380px; border-radius: 50%;
        background: radial-gradient(circle, var(--glow), transparent 70%);
        pointer-events: none; z-index: 0;
      }
      .app {
        position: relative; z-index: 1;
        width: 100%; max-width: 460px; height: 100dvh;
        background: var(--panel);
        display: flex; flex-direction: column; overflow: hidden;
        border-left: 1px solid var(--line); border-right: 1px solid var(--line);
        box-shadow: var(--shadow);
      }
      @media (min-width: 520px) {
        body { align-items: center; }
        .app { height: calc(100dvh - 32px); max-height: 900px; border-radius: 30px; border: 1px solid var(--line); }
      }
      .display { font-family: var(--display); font-weight: 700; letter-spacing: -0.01em; }
      .muted { color: var(--muted); }
      .small { font-size: 12px; }
      .tiny { font-size: 11px; }

      /* ================= ШАПКА ================= */
      .topbar {
        display: flex; align-items: center; justify-content: space-between;
        padding: 12px 14px 10px; border-bottom: 1px solid var(--line); flex-shrink: 0;
      }
      .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
      .logo {
        width: 34px; height: 34px; border-radius: 11px; flex-shrink: 0;
        display: grid; place-items: center;
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
        color: var(--on-accent); font-family: var(--display); font-weight: 700; font-size: 16px;
      }
      .logo.big { width: 64px; height: 64px; border-radius: 20px; font-size: 28px; }
      .logo-img { width: 34px; height: 34px; border-radius: 11px; flex-shrink: 0; display: block; box-shadow: 0 0 0 1px var(--line-2); }
      .logo-img.big { width: 72px; height: 72px; border-radius: 22px; box-shadow: 0 12px 30px var(--accent-soft); }
      .brand-name { letter-spacing: 0.06em; }
      .brand-name { font-family: var(--display); font-weight: 700; font-size: 15px; }
      .brand-sub { font-size: 10.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .admin-badge {
        font-size: 9px; font-weight: 800; letter-spacing: 0.08em;
        padding: 3px 7px; border-radius: 99px; color: var(--accent);
        border: 1px solid var(--accent); background: var(--accent-soft);
      }
      .top-actions { display: flex; gap: 6px; }
      .icon-btn {
        position: relative; width: 38px; height: 38px; border-radius: 12px;
        display: grid; place-items: center;
        background: var(--input); border: 1px solid var(--line);
        transition: border-color 0.2s;
      }
      .icon-btn:hover { border-color: var(--accent); }
      .icon-btn svg { width: 18px; height: 18px; }
      [data-theme="dark"] .theme-icon::before { content: "☀️"; }
      [data-theme="light"] .theme-icon::before { content: "🌙"; }
      .dot-badge {
        position: absolute; top: -4px; right: -4px; min-width: 17px; height: 17px; padding: 0 4px;
        border-radius: 99px; background: var(--accent); color: var(--on-accent);
        font-size: 10px; font-weight: 800; display: grid; place-items: center;
      }

      /* ================= ЭКРАНЫ ================= */
      .screens { flex: 1; position: relative; overflow: hidden; display: flex; flex-direction: column; }
      .screen { flex: 1; display: flex; flex-direction: column; min-height: 0; }
      .scroll { overflow-y: auto; }
      .scroll::-webkit-scrollbar { width: 4px; }
      .scroll::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 9px; }
      .center { align-items: center; justify-content: center; text-align: center; padding: 24px; }

      .spinner {
        width: 34px; height: 34px; border-radius: 50%;
        border: 3px solid var(--line-2); border-top-color: var(--accent);
        animation: spin 0.8s linear infinite; margin-bottom: 14px;
      }
      @keyframes spin { to { transform: rotate(360deg); } }

      /* ================= ВХОД ================= */
      .login { padding: 28px 22px; gap: 18px; justify-content: center; }
      .login h1 { font-size: 26px; line-height: 1.2; margin: 14px 0 6px; }
      .goal-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; width: 100%; }
      .goal-tile {
        padding: 12px; border-radius: 16px; text-align: left;
        background: var(--panel-2); border: 1px solid var(--line);
      }
      .goal-tile b { display: block; font-size: 13px; margin-top: 4px; }
      .goal-tile span { font-size: 11px; color: var(--muted); }
      .goal-tile .em { font-size: 20px; }
      .btn-google {
        width: 100%; padding: 14px; border-radius: 14px; font-weight: 700;
        display: flex; align-items: center; justify-content: center; gap: 10px;
        background: #fff; color: #1f1f1f; border: 1px solid rgba(0, 0, 0, 0.12);
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.12);
      }
      .btn-google svg { width: 20px; height: 20px; }
      .fine { font-size: 11px; color: var(--muted); line-height: 1.5; margin: 0; }
      .notice {
        width: 100%; padding: 11px 13px; border-radius: 14px; text-align: left; font-size: 12px; line-height: 1.45;
        background: var(--accent-soft); border: 1px solid var(--accent);
      }

      /* ================= КНОПКИ И ПОЛЯ ================= */
      .btn {
        padding: 11px 16px; border-radius: 13px; font-weight: 700; font-size: 13px;
        transition: transform 0.15s, box-shadow 0.2s, border-color 0.2s, background 0.2s;
      }
      .btn:active:not(:disabled) { transform: scale(0.98); }
      .btn.sm { padding: 7px 12px; font-size: 12px; border-radius: 11px; }
      .btn.grow { flex: 1; }
      .btn.full { width: 100%; }
      .btn-primary {
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
        color: var(--on-accent); box-shadow: 0 8px 22px var(--accent-soft);
      }
      .btn-ghost { background: var(--input); border: 1px solid var(--line-2); }
      .btn-ghost:hover { border-color: var(--accent); }
      .btn-danger { background: var(--danger-soft); color: var(--danger); border: 1px solid var(--danger); }
      .btn-ok { background: var(--ok-soft); color: var(--ok); border: 1px solid var(--ok); }
      .btn-link { color: var(--muted); font-size: 12px; padding: 8px; text-decoration: underline; }

      .field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
      .field > label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
      .field > label .muted { text-transform: none; letter-spacing: 0; font-weight: 500; }
      .input, .field input, .field select, .field textarea {
        width: 100%; padding: 11px 13px; border-radius: 13px;
        background: var(--input); border: 1px solid var(--line-2); outline: none;
        transition: border-color 0.2s;
      }
      .field select { appearance: none; background-image: none; }
      .field textarea { resize: none; }
      .input:focus, .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--accent); }
      .field select option { background: var(--panel); color: var(--text); }
      .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
      .row-name { display: grid; grid-template-columns: 2fr 1fr; gap: 10px; }

      .seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 6px; }
      .seg button, .chip {
        padding: 9px 10px; border-radius: 12px; font-size: 12.5px; font-weight: 600;
        background: var(--input); border: 1px solid var(--line-2); color: var(--muted);
        transition: all 0.18s;
      }
      .seg button.active, .chip.active {
        color: var(--text); border-color: var(--accent); background: var(--accent-soft);
      }
      .chips { display: flex; flex-wrap: wrap; gap: 6px; }
      .chip { padding: 6px 11px; border-radius: 99px; font-size: 12px; }
      .chip.static { cursor: default; }
      .chip.common { color: var(--accent); border-color: var(--accent); }

      .goal-pick { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
      .goal-pick button {
        padding: 10px; border-radius: 13px; text-align: left; font-weight: 700; font-size: 13px;
        background: var(--input); border: 1px solid var(--line-2); color: var(--muted); transition: all 0.18s;
      }
      .goal-pick button.active { color: var(--text); border-color: var(--gc); background: color-mix(in srgb, var(--gc) 15%, transparent); }

      .goal-badge {
        display: inline-flex; align-items: center; gap: 4px;
        padding: 4px 9px; border-radius: 99px; font-size: 11.5px; font-weight: 700;
        color: #fff; background: color-mix(in srgb, var(--gc) 78%, #000 0%);
      }
      .goal-badge.dim { opacity: 0.45; }
      .g-love { --gc: var(--love); }
      .g-friends { --gc: var(--friends); }
      .g-study { --gc: var(--study); }
      .g-team { --gc: var(--team); }

      .progress { height: 8px; border-radius: 99px; background: var(--input); border: 1px solid var(--line); overflow: hidden; }
      .progress-bar { height: 100%; width: 0; border-radius: 99px; background: linear-gradient(90deg, var(--accent-2), var(--accent)); transition: width 0.35s; }

      /* ================= ФОРМА ================= */
      .form-wrap { padding: 18px 18px 30px; display: flex; flex-direction: column; gap: 14px; }
      .form-head h2 { font-size: 20px; margin: 0 0 2px; }
      .form-head .progress { margin-top: 12px; }
      .photo-field { display: flex; justify-content: center; }
      .photo-box {
        position: relative; width: 120px; height: 154px; border-radius: 20px; overflow: hidden; cursor: pointer;
        border: 1.5px dashed var(--line-2); background: var(--input); transition: border-color 0.2s;
      }
      .photo-box:hover { border-color: var(--accent); }
      .photo-box img { width: 100%; height: 100%; object-fit: cover; }
      .photo-ph { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 8px; text-align: center; }
      .photo-ph .plus { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); font-size: 22px; }
      .photo-ph span { font-weight: 700; font-size: 12px; }
      .photo-ph small { font-size: 10px; color: var(--muted); }
      .photo-change { position: absolute; left: 6px; right: 6px; bottom: 6px; padding: 5px; border-radius: 9px; font-size: 11px; text-align: center; background: rgba(0, 0, 0, 0.6); color: #fff; }
      .add-skill { display: flex; gap: 6px; margin-top: 4px; }
      .add-skill input { flex: 1; }
      .form-actions { display: flex; gap: 8px; margin-top: 4px; }

      /* ================= ОСНОВНОЙ ЭКРАН ================= */
      .main { overflow: hidden; }
      .tabs { flex: 1; position: relative; display: flex; flex-direction: column; min-height: 0; }
      .tab { flex: 1; display: flex; flex-direction: column; min-height: 0; }
      .tab.scroll { padding: 16px 14px 20px; gap: 12px; }
      #tab-discover { padding: 12px 14px 8px; }

      .card-stack {
        position: relative; flex: 1; border-radius: 26px; overflow: hidden;
        background: var(--panel-2); border: 1px solid var(--line);
      }
      .swipe-card {
        position: absolute; inset: 0; touch-action: none; user-select: none; will-change: transform; cursor: grab;
        background: #111;
      }
      .swipe-card.animating { transition: transform 0.32s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.3s; }
      .card-photo { width: 100%; height: 100%; object-fit: cover; pointer-events: none; display: block; }
      .card-shade {
        position: absolute; inset: 0; pointer-events: none;
        background: linear-gradient(to top, rgba(6, 8, 14, 0.97) 6%, rgba(6, 8, 14, 0.72) 36%, rgba(6, 8, 14, 0.05) 66%, rgba(6, 8, 14, 0.35) 100%);
      }
      .card-top { position: absolute; top: 12px; left: 12px; right: 12px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
      .glass {
        padding: 5px 11px; border-radius: 99px; font-size: 11.5px; font-weight: 700; color: #fff;
        background: rgba(10, 12, 20, 0.55); border: 1px solid rgba(255, 255, 255, 0.18);
        backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      }
      .card-tools { display: flex; gap: 6px; flex-shrink: 0; }
      .card-tools button { cursor: pointer; }
      .card-tools .danger { color: #ff9aa8; border-color: rgba(255, 120, 140, 0.5); }
      .card-info { position: absolute; left: 0; right: 0; bottom: 0; padding: 18px 16px 16px; color: #fff; pointer-events: none; }
      .card-info h2 { margin: 6px 0 2px; font-size: 25px; font-weight: 800; }
      .card-info h2 span { font-weight: 500; opacity: 0.9; }
      .card-sub { margin: 0 0 6px; font-size: 12.5px; color: rgba(255, 255, 255, 0.75); }
      .card-bio { margin: 0 0 9px; font-size: 13px; line-height: 1.45; color: rgba(255, 255, 255, 0.88); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
      .goal-row, .skill-row { display: flex; flex-wrap: wrap; gap: 5px; }
      .skill-tag { padding: 3px 9px; border-radius: 99px; font-size: 11px; font-weight: 600; background: rgba(255, 255, 255, 0.12); border: 1px solid rgba(255, 255, 255, 0.16); }
      .skill-tag.common { background: rgba(217, 180, 126, 0.28); border-color: #d9b47e; }
      .stamp {
        position: absolute; top: 70px; padding: 6px 14px; border-radius: 12px; border: 3px solid;
        font-family: var(--display); font-weight: 700; font-size: 20px; letter-spacing: 0.06em;
        opacity: 0; pointer-events: none; background: rgba(0, 0, 0, 0.35);
      }
      .stamp-like { left: 18px; color: #7ff0bf; border-color: #7ff0bf; transform: rotate(-12deg); }
      .stamp-skip { right: 18px; color: #ff9aa8; border-color: #ff9aa8; transform: rotate(12deg); }

      .swipe-actions { display: flex; align-items: center; justify-content: center; gap: 14px; padding: 12px 0 4px; flex-shrink: 0; }
      .round { border-radius: 50%; display: grid; place-items: center; transition: transform 0.15s, opacity 0.2s; }
      .round:active:not(:disabled) { transform: scale(0.92); }
      .round svg { width: 24px; height: 24px; }
      .round.sm { width: 42px; height: 42px; background: var(--input); border: 1px solid var(--line-2); color: var(--muted); font-size: 18px; }
      .round.md { width: 50px; height: 50px; background: var(--input); border: 1px solid var(--accent); color: var(--accent); }
      .round.lg { width: 60px; height: 60px; }
      .round.ghost { background: var(--input); border: 1px solid var(--line-2); color: var(--danger); }
      .round.primary { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: var(--on-accent); box-shadow: 0 10px 26px var(--accent-soft); }
      .swipe-actions.off { opacity: 0.35; pointer-events: none; }

      .empty { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px; gap: 8px; }
      .empty .em { font-size: 40px; }
      .empty h3 { margin: 4px 0 0; font-size: 17px; }
      .empty p { margin: 0 0 8px; color: var(--muted); font-size: 12.5px; line-height: 1.5; max-width: 280px; }

      .section-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
      .section-head h2 { margin: 0; font-size: 17px; font-family: var(--display); }
      .section-head p { margin: 2px 0 0; font-size: 12px; color: var(--muted); }
      .section-head.mt { margin-top: 10px; padding-top: 14px; border-top: 1px solid var(--line); }
      .sub-head { margin: 8px 0 0; font-size: 14px; display: flex; align-items: center; gap: 8px; }
      .count { min-width: 26px; padding: 3px 9px; border-radius: 99px; font-size: 12px; font-weight: 800; text-align: center; color: var(--accent); background: var(--accent-soft); border: 1px solid var(--accent); }
      .stack { display: flex; flex-direction: column; gap: 10px; }

      .item { padding: 12px; border-radius: 18px; background: var(--panel-2); border: 1px solid var(--line); display: flex; flex-direction: column; gap: 10px; }
      .item.banned { border-color: var(--danger); background: var(--danger-soft); }
      .person { display: flex; gap: 11px; align-items: center; }
      .person img { width: 56px; height: 68px; border-radius: 14px; object-fit: cover; flex-shrink: 0; background: var(--input); }
      .person.sm img { width: 40px; height: 40px; border-radius: 12px; }
      .person .meta { min-width: 0; flex: 1; }
      .person h4 { margin: 0; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .person p { margin: 2px 0 0; font-size: 12px; color: var(--muted); }
      .bubble { padding: 9px 12px; border-radius: 14px; font-size: 12.5px; line-height: 1.45; background: var(--accent-soft); border: 1px solid var(--accent); word-break: break-word; }
      .actions { display: flex; gap: 8px; }
      .contacts { display: flex; flex-direction: column; gap: 6px; }
      .contact-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 9px 11px; border-radius: 13px; background: var(--input); border: 1px solid var(--line-2); }
      .contact-row small { display: block; font-size: 10px; text-transform: uppercase; color: var(--muted); letter-spacing: 0.05em; }
      .contact-row b { font-size: 13px; word-break: break-all; }
      .contact-row .actions { gap: 6px; flex-shrink: 0; }
      .contact-row a { text-decoration: none; }

      .post .post-head { display: flex; justify-content: space-between; align-items: center; }
      .post h3 { margin: 0; font-size: 15px; }
      .post .text { margin: 0; font-size: 13px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; }
      .post-foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding-top: 8px; border-top: 1px solid var(--line); }
      .kind { font-size: 11.5px; font-weight: 800; padding: 4px 10px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); }

      .profile-card { position: relative; height: 300px; border-radius: 22px; overflow: hidden; background: #111; }
      .stats { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
      .stat { padding: 10px 4px; border-radius: 14px; text-align: center; background: var(--panel-2); border: 1px solid var(--line); }
      .stat b { display: block; font-size: 17px; }
      .stat span { font-size: 9.5px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); }
      .checklist { display: flex; flex-direction: column; gap: 6px; margin-top: 4px; }
      .checklist button { text-align: left; font-size: 12.5px; padding: 8px 10px; border-radius: 11px; background: var(--input); border: 1px dashed var(--line-2); color: var(--muted); }
      .checklist button:hover { color: var(--text); border-color: var(--accent); }
      .uid-line { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 11px; color: var(--muted); }
      .uid-line code { font-size: 10.5px; word-break: break-all; }

      /* ================= НИЖНЯЯ НАВИГАЦИЯ ================= */
      .bottom-nav { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; padding: 6px 6px calc(6px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); flex-shrink: 0; background: var(--panel); }
      .nav-btn { position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 7px 2px; border-radius: 14px; color: var(--muted); font-size: 10.5px; font-weight: 700; }
      .nav-btn svg { width: 21px; height: 21px; }
      .nav-btn.active { color: var(--accent); }
      .nav-btn .dot-badge { top: 2px; right: calc(50% - 22px); }

      /* ================= МОДАЛКИ ================= */
      .modal { position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center; padding: 16px; background: var(--overlay); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
      .modal.sheet { align-items: flex-end; padding: 0; }
      .modal-box { width: 100%; max-width: 400px; max-height: 90dvh; overflow-y: auto; padding: 18px; border-radius: 24px; background: var(--panel); border: 1px solid var(--line-2); box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 12px; animation: pop 0.22s cubic-bezier(0.16, 1, 0.3, 1); }
      .sheet .modal-box { max-width: 460px; border-radius: 24px 24px 0 0; padding-bottom: calc(18px + env(safe-area-inset-bottom)); }
      .modal-box h3 { margin: 0; font-size: 17px; font-family: var(--display); }
      @keyframes pop { from { opacity: 0; transform: translateY(10px) scale(0.97); } to { opacity: 1; transform: none; } }
      .match-photos { display: flex; justify-content: center; align-items: center; gap: 0; margin: 4px 0; }
      .match-photos img { width: 96px; height: 124px; border-radius: 18px; object-fit: cover; border: 2px solid var(--accent); background: #111; }
      .match-photos img:first-child { transform: rotate(-5deg); }
      .match-photos img:last-child { transform: rotate(5deg); }
      .match-heart { width: 40px; height: 40px; margin: 0 -10px; z-index: 2; border-radius: 50%; display: grid; place-items: center; background: var(--accent); color: var(--on-accent); font-size: 18px; box-shadow: 0 0 24px var(--accent); }
      .text-center { text-align: center; }

      .toast { position: fixed; top: 16px; left: 50%; transform: translateX(-50%) translateY(-20px); z-index: 80; max-width: 90vw; padding: 10px 16px; border-radius: 99px; background: var(--elev); color: var(--text); border: 1px solid var(--accent); box-shadow: var(--shadow); font-size: 12.5px; font-weight: 600; text-align: center; opacity: 0; pointer-events: none; transition: all 0.25s; }
      .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

      /* язык */
      .lang-btn { font-size: 11px; font-weight: 800; letter-spacing: 0.04em; }
      .lang-seg { width: 100%; }
      .lang-seg button { font-size: 12px; }
    </style>
  </head>

  <body>
    <div class="bg-glow"></div>

    <div class="app" id="app">
      <!-- ================= ШАПКА ================= -->
      <header class="topbar">
        <div class="brand">
          <img class="logo-img" src="logo.svg" alt="JUPTAS" />
          <div style="min-width: 0">
            <div class="brand-name" id="brand-name">JUPTAS</div>
            <div class="brand-sub" id="brand-sub"></div>
          </div>
          <span class="admin-badge" id="admin-badge" hidden>ADMIN</span>
        </div>
        <div class="top-actions">
          <button class="icon-btn" id="btn-filters" data-action="open-filters" data-i18n-title="tip.filters" hidden>
            <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" d="M4 6h16M7 12h10M10 18h4" /></svg>
            <span class="dot-badge" id="filters-count" hidden>0</span>
          </button>
          <button class="icon-btn lang-btn" id="btn-lang" data-action="cycle-lang" data-i18n-title="tip.lang">RU</button>
          <button class="icon-btn" data-action="toggle-theme" data-i18n-title="tip.theme"><span class="theme-icon"></span></button>
        </div>
      </header>

      <div class="screens">
        <!-- ================= ЗАГРУЗКА ================= -->
        <section id="screen-loading" class="screen center">
          <div class="spinner"></div>
          <p class="muted small" id="loading-text" data-i18n="loading.connect"></p>
        </section>

        <!-- ================= ВХОД ================= -->
        <section id="screen-login" class="screen center scroll login" hidden>
          <div>
            <img class="logo-img big" src="logo.svg" alt="JUPTAS" style="margin: 0 auto; display: block" />
            <h1 class="display" data-i18n-html="login.h1"></h1>
            <p class="muted" style="margin: 0" id="login-sub"></p>
          </div>
          <div class="goal-grid">
            <div class="goal-tile"><span class="em">❤️</span><b data-i18n="goal.love"></b><span data-i18n="goal.love.d"></span></div>
            <div class="goal-tile"><span class="em">🤝</span><b data-i18n="goal.friends"></b><span data-i18n="goal.friends.d"></span></div>
            <div class="goal-tile"><span class="em">📚</span><b data-i18n="goal.study"></b><span data-i18n="goal.study.d"></span></div>
            <div class="goal-tile"><span class="em">💻</span><b data-i18n="goal.team"></b><span data-i18n="goal.team.d"></span></div>
          </div>
          <div class="notice" id="inapp-warning" data-i18n-html="login.inapp" hidden></div>
          <button class="btn-google" data-action="login">
            <svg viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
            <span data-i18n="login.google"></span>
          </button>
          <div class="seg lang-seg" id="login-lang">
            <button type="button" data-action="set-lang" data-value="kk">Қазақша</button>
            <button type="button" data-action="set-lang" data-value="ru">Русский</button>
            <button type="button" data-action="set-lang" data-value="en">English</button>
          </div>
          <p class="fine" data-i18n="login.fine"></p>
        </section>

        <!-- ================= АНКЕТА ================= -->
        <section id="screen-form" class="screen scroll" hidden>
          <form id="profile-form" class="form-wrap" novalidate>
            <div class="form-head">
              <h2 class="display" id="form-title"></h2>
              <p class="muted small" style="margin: 0" data-i18n="form.required"></p>
              <div class="progress"><div class="progress-bar" id="form-progress"></div></div>
              <p class="tiny muted" style="margin: 6px 0 0" id="form-progress-text"></p>
            </div>

            <div class="photo-field">
              <label for="f-photo" class="photo-box">
                <img id="f-photo-preview" alt="" hidden />
                <div class="photo-ph" id="photo-ph">
                  <span class="plus">+</span>
                  <span data-i18n="form.photo"></span>
                  <small data-i18n="form.photoHint"></small>
                </div>
                <span class="photo-change" id="photo-change" data-i18n="form.photoChange" hidden></span>
              </label>
              <input type="file" id="f-photo" accept="image/*" hidden />
            </div>

            <div class="row-name">
              <div class="field">
                <label for="f-name" data-i18n="form.name"></label>
                <input id="f-name" maxlength="30" data-i18n-ph="form.namePh" autocomplete="given-name" />
              </div>
              <div class="field">
                <label for="f-age" data-i18n="form.age"></label>
                <input id="f-age" type="number" inputmode="numeric" min="18" max="60" placeholder="19" />
              </div>
            </div>

            <div class="field">
              <label data-i18n="form.gender"></label>
              <div class="seg" data-single="gender">
                <button type="button" data-value="m" data-i18n="gender.m"></button>
                <button type="button" data-value="f" data-i18n="gender.f"></button>
              </div>
            </div>

            <div class="field">
              <label><span data-i18n="form.goals"></span> <span class="muted" data-i18n="form.goalsHint"></span></label>
              <div class="goal-pick" data-multi="goals">
                <button type="button" class="g-love" data-value="love">❤️ <span data-i18n="goal.love"></span></button>
                <button type="button" class="g-friends" data-value="friends">🤝 <span data-i18n="goal.friends"></span></button>
                <button type="button" class="g-study" data-value="study">📚 <span data-i18n="goal.study"></span></button>
                <button type="button" class="g-team" data-value="team">💻 <span data-i18n="goal.team"></span></button>
              </div>
            </div>

            <div class="field" id="field-looking" hidden>
              <label data-i18n="form.looking"></label>
              <div class="seg" data-single="lookingFor">
                <button type="button" data-value="f" data-i18n="looking.f"></button>
                <button type="button" data-value="m" data-i18n="looking.m"></button>
                <button type="button" data-value="any" data-i18n="looking.any"></button>
              </div>
            </div>

            <div class="field">
              <label for="f-faculty" data-i18n="form.faculty"></label>
              <input id="f-faculty" list="faculty-list" maxlength="60" data-i18n-ph="form.facultyPh" />
              <datalist id="faculty-list"></datalist>
            </div>

            <div class="row-2">
              <div class="field">
                <label for="f-course" data-i18n="form.course"></label>
                <select id="f-course"></select>
              </div>
              <div class="field">
                <label for="f-group" data-i18n="form.group"></label>
                <input id="f-group" maxlength="20" placeholder="ИС-24-1" />
              </div>
            </div>

            <div class="field">
              <label><span data-i18n="form.skills"></span> <span class="muted" id="skills-count">0 / 10</span></label>
              <div class="chips" id="f-skills"></div>
              <div class="add-skill">
                <input class="input" id="f-skill-custom" maxlength="24" data-i18n-ph="form.skillPh" />
                <button type="button" class="btn btn-ghost sm" data-action="add-skill" data-i18n="btn.add"></button>
              </div>
            </div>

            <div class="field">
              <label for="f-bio"><span data-i18n="form.bio"></span> <span class="muted" id="bio-count">0 / 200</span></label>
              <textarea id="f-bio" rows="3" maxlength="200" data-i18n-ph="form.bioPh"></textarea>
            </div>

            <div class="field">
              <label><span data-i18n="form.contacts"></span> <span class="muted" data-i18n="form.contactsHint"></span></label>
              <div class="row-2">
                <input id="f-tg" maxlength="40" placeholder="Telegram @username" autocapitalize="off" />
                <input id="f-ig" maxlength="40" placeholder="Instagram @username" autocapitalize="off" />
              </div>
            </div>

            <div class="form-actions">
              <button type="button" class="btn btn-ghost" id="btn-form-cancel" data-action="cancel-form" data-i18n="btn.cancel" hidden></button>
              <button type="submit" class="btn btn-primary grow" id="btn-form-submit" data-i18n="btn.save"></button>
            </div>
            <button type="button" class="btn-link" data-action="logout" data-i18n="btn.logoutAcc"></button>
          </form>
        </section>

        <!-- ================= БАН ================= -->
        <section id="screen-banned" class="screen center" hidden>
          <div style="font-size: 44px">⛔</div>
          <h2 class="display" style="font-size: 19px; margin: 10px 0 6px" data-i18n="banned.title"></h2>
          <p class="muted small" style="max-width: 290px; line-height: 1.5" data-i18n="banned.text"></p>
          <button class="btn btn-ghost" data-action="logout" style="margin-top: 12px" data-i18n="btn.logout"></button>
        </section>

        <!-- ================= ОСНОВНОЕ ПРИЛОЖЕНИЕ ================= -->
        <section id="screen-main" class="screen main" hidden>
          <div class="tabs">
            <!-- Лента -->
            <div class="tab" id="tab-discover">
              <div class="card-stack" id="feed-stack"></div>
              <div class="swipe-actions" id="swipe-actions">
                <button class="round sm" id="btn-undo" data-action="undo" data-i18n-title="tip.undo" disabled>↶</button>
                <button class="round lg ghost" data-action="skip" data-i18n-title="tip.skip">
                  <svg fill="none" stroke="currentColor" stroke-width="2.4" viewBox="0 0 24 24"><path stroke-linecap="round" d="M6 18L18 6M6 6l12 12" /></svg>
                </button>
                <button class="round md" data-action="msg-like" data-i18n-title="tip.msgLike">
                  <svg fill="none" stroke="currentColor" stroke-width="1.9" viewBox="0 0 24 24" style="width: 21px; height: 21px"><path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" /></svg>
                </button>
                <button class="round lg primary" data-action="like" data-i18n-title="tip.like">
                  <svg fill="currentColor" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.420 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" /></svg>
                </button>
              </div>
            </div>

            <!-- Доска «Ищу команду» -->
            <div class="tab scroll" id="tab-posts" hidden>
              <div class="section-head">
                <div>
                  <h2 data-i18n="posts.title"></h2>
                  <p data-i18n="posts.sub"></p>
                </div>
                <button class="btn btn-primary sm" data-action="new-post" data-i18n="posts.new"></button>
              </div>
              <div class="chips" id="post-kind-filter"></div>
              <div class="stack" id="posts-list"></div>
            </div>

            <!-- Симпатии -->
            <div class="tab scroll" id="tab-likes" hidden>
              <div class="section-head">
                <div>
                  <h2 data-i18n="likes.in"></h2>
                  <p data-i18n="likes.inSub"></p>
                </div>
                <span class="count" id="incoming-count">0</span>
              </div>
              <div class="stack" id="incoming-list"></div>
              <div class="section-head mt">
                <div>
                  <h2 data-i18n="likes.matches"></h2>
                  <p data-i18n="likes.matchesSub"></p>
                </div>
                <span class="count" id="matches-count">0</span>
              </div>
              <div class="stack" id="matches-list"></div>
            </div>

            <!-- Профиль -->
            <div class="tab scroll" id="tab-profile" hidden>
              <div class="stack" id="profile-content"></div>
            </div>

            <!-- Админ -->
            <div class="tab scroll" id="tab-admin" hidden>
              <div class="section-head">
                <div>
                  <h2 data-i18n="admin.title"></h2>
                  <p data-i18n="admin.sub"></p>
                </div>
              </div>
              <div class="stats" id="admin-stats"></div>
              <h3 class="sub-head"><span data-i18n="admin.reports"></span> <span class="count" id="reports-count">0</span></h3>
              <div class="stack" id="admin-reports"></div>
              <h3 class="sub-head" data-i18n="admin.users"></h3>
              <input class="input" id="admin-search" data-i18n-ph="admin.search" />
              <div class="chips" id="admin-filter">
                <button class="chip active" data-action="admin-filter" data-value="all" data-i18n="filter.all"></button>
                <button class="chip" data-action="admin-filter" data-value="active" data-i18n="filter.active"></button>
                <button class="chip" data-action="admin-filter" data-value="banned" data-i18n="filter.banned"></button>
              </div>
              <div class="stack" id="admin-users"></div>
            </div>
          </div>

          <nav class="bottom-nav" id="bottom-nav">
            <button class="nav-btn active" data-action="tab" data-tab="discover">
              <svg fill="none" stroke="currentColor" stroke-width="1.9" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M17.657 18.657A8 8 0 016.343 7.343S7 9 9 10c0-2 .5-5 2.986-7C14 5 16.09 5.777 17.656 7.343A7.975 7.975 0 0120 13a7.975 7.975 0 01-2.343 5.657z" /></svg>
              <span data-i18n="nav.discover"></span>
            </button>
            <button class="nav-btn" data-action="tab" data-tab="posts">
              <svg fill="none" stroke="currentColor" stroke-width="1.9" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M17 20h5v-2a3 3 0 00-5.36-1.86M17 20H7m10 0v-2c0-.66-.13-1.28-.36-1.86M7 20H2v-2a3 3 0 015.36-1.86M7 20v-2c0-.66.13-1.28.36-1.86m0 0a5 5 0 019.28 0M15 7a3 3 0 11-6 0 3 3 0 016 0z" /></svg>
              <span data-i18n="nav.posts"></span>
            </button>
            <button class="nav-btn" data-action="tab" data-tab="likes">
              <span class="dot-badge" id="badge-likes" hidden>0</span>
              <svg fill="none" stroke="currentColor" stroke-width="1.9" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z" /></svg>
              <span data-i18n="nav.likes"></span>
            </button>
            <button class="nav-btn" data-action="tab" data-tab="profile">
              <svg fill="none" stroke="currentColor" stroke-width="1.9" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" /></svg>
              <span data-i18n="nav.profile"></span>
            </button>
            <button class="nav-btn" data-action="tab" data-tab="admin" id="nav-admin" hidden>
              <svg fill="none" stroke="currentColor" stroke-width="1.9" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" /></svg>
              <span data-i18n="nav.admin"></span>
            </button>
          </nav>
        </section>
      </div>

      <!-- ================= МОДАЛКА: СООБЩЕНИЕ С ЛАЙКОМ ================= -->
      <div class="modal" id="modal-msg" hidden>
        <div class="modal-box">
          <div class="person sm">
            <img id="msg-photo" alt="" />
            <div class="meta">
              <span class="tiny muted" id="msg-kicker"></span>
              <h4 id="msg-name"></h4>
            </div>
          </div>
          <textarea class="input" id="msg-text" rows="3" maxlength="200" data-i18n-ph="msg.ph" style="resize: none"></textarea>
          <div>
            <p class="tiny muted" style="margin: 0 0 6px" data-i18n="msg.ice"></p>
            <div class="chips" id="msg-icebreakers"></div>
          </div>
          <div class="actions">
            <button class="btn btn-ghost" data-action="close-modal" data-modal="modal-msg" data-i18n="btn.cancel"></button>
            <button class="btn btn-primary grow" data-action="send-msg" data-i18n="msg.send"></button>
          </div>
        </div>
      </div>

      <!-- ================= МОДАЛКА: МЭТЧ ================= -->
      <div class="modal" id="modal-match" hidden>
        <div class="modal-box text-center">
          <p class="tiny muted" style="margin: 0; letter-spacing: 0.2em" data-i18n="match.kicker"></p>
          <h3 style="font-size: 22px" data-i18n="match.title"></h3>
          <div class="match-photos">
            <img id="match-me" alt="" />
            <div class="match-heart">♥</div>
            <img id="match-them" alt="" />
          </div>
          <div>
            <b id="match-name" style="font-size: 16px"></b>
            <div class="goal-row" id="match-goals" style="justify-content: center; margin-top: 6px"></div>
          </div>
          <div class="bubble" id="match-message" hidden></div>
          <div class="contacts" id="match-contacts" style="text-align: left"></div>
          <button class="btn btn-ghost full" data-action="close-modal" data-modal="modal-match" data-i18n="btn.continue"></button>
        </div>
      </div>

      <!-- ================= МОДАЛКА: ЖАЛОБА ================= -->
      <div class="modal" id="modal-report" hidden>
        <div class="modal-box">
          <h3 data-i18n="report.title"></h3>
          <p class="small muted" style="margin: 0" data-i18n="report.text"></p>
          <div class="chips" id="report-reasons">

      /* =====================================================================
         2. ЯЗЫК
      ===================================================================== */
      const LANGS = ["kk", "ru", "en"];
      const LANG_SHORT = { kk: "KZ", ru: "RU", en: "EN" };
      let LANG = (() => {
        try {
          const saved = localStorage.getItem("cl_lang");
          if (LANGS.includes(saved)) return saved;
        } catch (e) {}
        const nav = (navigator.language || "ru").toLowerCase();
        if (nav.startsWith("kk")) return "kk";
        if (nav.startsWith("en")) return "en";
        return "ru";
      })();

      function t(key, vars = {}) {
        let s = I18N[LANG][key] ?? I18N.ru[key] ?? key;
        if (typeof s !== "string") return s;
        for (const [k, v] of Object.entries(vars)) s = s.split(`{${k}}`).join(String(v));
        return s;
      }

      function applyStaticI18n() {
        document.documentElement.lang = LANG === "kk" ? "kk" : LANG;
        $$("[data-i18n]").forEach((el) => (el.textContent = t(el.dataset.i18n)));
        $$("[data-i18n-html]").forEach((el) => (el.innerHTML = t(el.dataset.i18nHtml))); // только строки из словаря
        $$("[data-i18n-ph]").forEach((el) => (el.placeholder = t(el.dataset.i18nPh)));
        $$("[data-i18n-title]").forEach((el) => (el.title = t(el.dataset.i18nTitle)));
        document.title = t("meta.title", { app: CONFIG.APP_NAME });
        $("#brand-sub").textContent = t("brand.sub", { uni: CONFIG.UNIVERSITY });
        $("#login-sub").textContent = t("login.sub", { uni: CONFIG.UNIVERSITY });
        $("#btn-lang").textContent = LANG_SHORT[LANG];
        $$("#login-lang button").forEach((b) => b.classList.toggle("active", b.dataset.value === LANG));
      }

      function setLang(lang) {
        if (!LANGS.includes(lang)) return;
        LANG = lang;
        try { localStorage.setItem("cl_lang", lang); } catch (e) {}
        applyStaticI18n();
        // перерисовываем динамические части
        const course = $("#f-course").value;
        buildFormStatic();
        $("#f-course").value = course;
        if (S.formOpen) {
          $("#form-title").textContent = myProfile() ? t("form.edit") : t("form.create");
          renderFormSkills();
          updateFormMeta();
        }
        if (!$("#modal-filters").hidden) renderFilterSheet();
        if (!$("#modal-post").hidden) renderPostDraft();
        S.feedSig = "";
        if (S.user && S.loaded.profiles) route();
      }

      // Навыки храним ключами, чтобы фильтр работал на всех языках
      const SKILL_KEYS = [
        "Python", "JavaScript", "Java", "C++", "Frontend", "Backend", "Mobile", "UI/UX", "Data / ML", "DevOps",
        "security", "iot", "pm", "marketing", "design", "math", "english", "sport", "music", "games", "photo",
      ];
      const skillLabel = (s) => (I18N[LANG]["skill." + s] ?? I18N.ru["skill." + s] ?? s);

      const GOAL_EMOJI = { love: "❤️", friends: "🤝", study: "📚", team: "💻" };
      const goalBadge = (g, dim = false) => (GOAL_EMOJI[g] ? `<span class="goal-badge g-${g}${dim ? " dim" : ""}">${GOAL_EMOJI[g]} ${esc(t("goal." + g))}</span>` : "");

      const POST_KINDS = { hackathon: "🏆", project: "🚀", study: "📚" };
      const kindLabel = (k) => `${POST_KINDS[k] || "🚀"} ${t("kind." + (POST_KINDS[k] ? k : "project"))}`;

      function reasonLabel(raw) {
        const s = String(raw || "");
        const i = s.indexOf(":");
        const key = i === -1 ? s : s.slice(0, i);
        const rest = i === -1 ? "" : s.slice(i);
        return ["fake", "photo", "abuse", "spam", "other"].includes(key) ? t("reason." + key) + rest : s;

      /* =====================================================================
         3. FIREBASE И СОСТОЯНИЕ
      ===================================================================== */
      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);
      const db = getFirestore(app);
      const C = CONFIG.COL;

      const ref = {
        profile: (uid) => doc(db, C.profiles, uid),
        priv: (uid) => doc(db, C.private, uid),
        like: (from, to) => doc(db, C.likes, `${from}_${to}`),
        likeById: (id) => doc(db, C.likes, id),
        post: (id) => doc(db, C.posts, id),
        report: (id) => doc(db, C.reports, id),
        admin: (uid) => doc(db, C.admins, uid),
      };

      const S = {
        user: null,
        uid: null,
        isAdmin: false,
        loaded: { profiles: false, priv: false, out: false, inc: false },
        profiles: new Map(),

        tab: "discover",

        filters: loadFilters(),
        filterDraft: null,
        feedSig: "",
        topUid: null,

        feedDirty: false,

        pendingReport: null,
        reportReason: "",

        postKindFilter: "all",
        adminFilter: "all",
        adminQuery: "",
        confirmFn: null,
      };

      /* =====================================================================
         4. УТИЛИТЫ
      ===================================================================== */
      function esc(v) {
        return String(v ?? "")
          .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;").replace(/'/g, "&#39;").replace(/`/g, "&#96;");
      }

      let toastTimer = null;
      function toast(text) {
        const el = $("#toast");
        el.textContent = text;
        el.classList.add("show");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => el.classList.remove("show"), 3200);
      }

      function fbErr(err) {
        const code = String(err?.code || "");
        if (code.includes("permission-denied")) return t("err.perm");
        if (code.includes("unavailable")) return t("err.offline");
        if (code.includes("resource-exhausted")) return t("err.quota");
        return t("err.generic", { x: code || err?.message || "?" });
      }

      function authErr(err) {
        const code = String(err?.code || "");
        if (code.includes("unauthorized-domain")) return t("auth.domain", { host });
        if (code.includes("operation-not-allowed")) return t("auth.provider");
        if (code.includes("network-request-failed")) return t("err.offline");
        return t("auth.generic", { x: code || err?.message });
      }

      function monogram(name = "?") {
        const letter = esc((String(name).trim()[0] || "?").toUpperCase());
        const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="400" height="520" viewBox="0 0 400 520"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1A2136"/><stop offset="1" stop-color="#0B0F1C"/></linearGradient></defs><rect width="400" height="520" fill="url(#g)"/><circle cx="200" cy="230" r="80" fill="none" stroke="#D9B47E" stroke-opacity=".5" stroke-width="2"/><text x="200" y="252" text-anchor="middle" fill="#F2F4F8" font-family="Georgia,serif" font-size="64">${letter}</text></svg>`;
        return "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(svg);
      }
      const photoOf = (p) => (p && p.photo) || monogram(p?.name);

      document.addEventListener(
        "error",
        (e) => {
          const el = e.target;
          if (el && el.tagName === "IMG" && el.dataset.fallback !== undefined && !el.dataset.failed) {
            el.dataset.failed = "1";
            el.src = monogram(el.dataset.fallback);
          }
        },
        true
      );

      function img(p, cls = "") {
        return `<img class="${cls}" src="${esc(photoOf(p))}" alt="${esc(p?.name)}" data-fallback="${esc(p?.name || "?")}" />`;
      }

      function courseLabel(c) {
        if (c === "master") return t("course.master");
        return /^\d+$/.test(String(c)) ? t("course.n", { n: c }) : String(c || "");
      }

      function timeAgo(ts) {
        const s = Math.max(1, Math.floor((Date.now() - (ts || 0)) / 1000));
        if (s < 60) return t("time.now");
        const m = Math.floor(s / 60);
        if (m < 60) return t("time.min", { n: m });
        const h = Math.floor(m / 60);
        if (h < 24) return t("time.h", { n: h });
        const d = Math.floor(h / 24);
        return d < 30 ? t("time.d", { n: d }) : new Date(ts).toLocaleDateString(LANG === "en" ? "en-GB" : LANG === "kk" ? "kk-KZ" : "ru-RU");
      }

      function cleanHandle(raw) {
        let h = String(raw || "").trim();
        h = h.replace(/^https?:\/\//i, "").replace(/^(www\.)?(t\.me|telegram\.me|instagram\.com)\//i, "");
        h = h.replace(/^@+/, "").replace(/[/?#].*$/, "");
        return h;
      }
      const validHandle = (h) => /^[A-Za-z0-9_.]{2,32}$/.test(h);

      function copyText(text) {
        const done = () => toast(t("toast.copied", { x: text }));
        if (navigator.clipboard?.writeText) {
          navigator.clipboard.writeText(text).then(done, () => toast(t("toast.copyFail")));
        } else {
          const ta = document.createElement("textarea");
          ta.value = text;
          ta.style.position = "fixed";
          ta.style.opacity = "0";
          document.body.appendChild(ta);
          ta.select();
          try { document.execCommand("copy"); done(); } catch (e) { toast(t("toast.copyFail")); }
          ta.remove();
        }
      }

      function loadFilters() {
        const base = { goal: "all", course: "all", faculty: "all", skills: [] };
        try {
          const raw = JSON.parse(localStorage.getItem("cl_filters") || "null");
          if (raw && typeof raw === "object") return { ...base, ...raw, skills: Array.isArray(raw.skills) ? raw.skills : [] };
        } catch (e) {}
        return base;
      }
      function saveFilters() {
        try { localStorage.setItem("cl_filters", JSON.stringify(S.filters)); } catch (e) {}
      }

      function openModal(id) { $("#" + id).hidden = false; }
      function closeModal(id) { $("#" + id).hidden = true; }

      function askConfirm(title, text, okLabel, fn) {
        $("#confirm-title").textContent = title;
        $("#confirm-text").textContent = text;
        $("#confirm-ok").textContent = okLabel;
        S.confirmFn = fn;
        openModal("modal-confirm");
      }

      const myProfile = () => (S.uid ? S.profiles.get(S.uid) || null : null);
      const prefOk = (pref, gender) => pref === "any" || pref === gender;

      /* =====================================================================
         5. ТЕМА
      ===================================================================== */
      function setTheme(th) {
        document.documentElement.setAttribute("data-theme", th);
        $('meta[name="theme-color"]').setAttribute("content", th === "light" ? "#F4F1EA" : "#070A12");
        try { localStorage.setItem("cl_theme", th); } catch (e) {}
      }
      setTheme(document.documentElement.getAttribute("data-theme") || "dark");

      /* =====================================================================
         6. ВХОД ЧЕРЕЗ GOOGLE
      ===================================================================== */
      const isInApp = /Instagram|FBAN|FBAV|FB_IAB|Line\/|TikTok|musical_ly|Bytedance|Snapchat/i.test(navigator.userAgent);
      $("#inapp-warning").hidden = !isInApp;

      async function login() {
        const provider = new GoogleAuthProvider();
        provider.setCustomParameters({ prompt: "select_account" });
        try {
          await signInWithPopup(auth, provider);
        } catch (e) {
          const code = String(e?.code || "");
          if (code.includes("popup-blocked") || code.includes("operation-not-supported") || code.includes("cancelled-popup")) {
            await signInWithRedirect(auth, provider);
          } else if (!code.includes("popup-closed-by-user")) {
            toast(authErr(e));
          }
        }
      }

      getRedirectResult(auth).catch((e) => toast(authErr(e)));

      onAuthStateChanged(auth, async (user) => {
        teardown();
        S.user = user;
        S.uid = user ? user.uid : null;
        if (!user) {
          showScreen("screen-login");
          return;
        }
        showScreen("screen-loading");
        $("#loading-text").textContent = t("loading.profiles");
        try {
          const a = await getDoc(ref.admin(user.uid));
          S.isAdmin = a.exists();
        } catch (e) {
          S.isAdmin = false;
        }
        startListeners();
      });

      function teardown() {
        S.unsub.forEach((fn) => { try { fn(); } catch (e) {} });
        S.unsub = [];
        Object.assign(S, {
          isAdmin: false,
          loaded: { profiles: false, priv: false, out: false, inc: false },
          profiles: new Map(), myPrivate: null, outgoing: new Map(), incoming: new Map(),
          posts: [], allLikes: [], allPrivate: new Map(), reports: [], contactsCache: new Map(), knownMatches: null,
          editing: false, formOpen: false, feedSig: "", lastSwipe: null, undoUid: null, tab: "discover",
        });
        $$(".modal").forEach((m) => (m.hidden = true));
      }

      /* =====================================================================
         7. ПОДПИСКИ НА ДАННЫЕ
      ===================================================================== */
      function listenError(label) {
        return (err) => {
          console.error(label, err);
          $("#loading-text").textContent = fbErr(err);
          toast(fbErr(err));
        };
      }

      function startListeners() {
        const uid = S.uid;

        S.unsub.push(
          onSnapshot(collection(db, C.profiles), (snap) => {
            const m = new Map();
            snap.forEach((d) => {
              const x = d.data();
              if (x && x.uid === d.id) m.set(d.id, x);
            });
            S.profiles = m;
            S.loaded.profiles = true;
            route();
          }, listenError("profiles"))
        );

        S.unsub.push(
          onSnapshot(ref.priv(uid), (d) => {
            S.myPrivate = d.exists() ? d.data() : null;
            S.loaded.priv = true;
            route();
          }, listenError("private"))
        );

        S.unsub.push(
          onSnapshot(query(collection(db, C.likes), where("fromUid", "==", uid)), (snap) => {
            const m = new Map();
            snap.forEach((d) => m.set(d.data().toUid, { id: d.id, ...d.data() }));
            S.outgoing = m;
            S.loaded.out = true;
            onLikesChanged();
          }, listenError("outgoing"))
        );

        S.unsub.push(
          onSnapshot(query(collection(db, C.likes), where("toUid", "==", uid)), (snap) => {
            const m = new Map();
            snap.forEach((d) => m.set(d.data().fromUid, { id: d.id, ...d.data() }));
            S.incoming = m;
            S.loaded.inc = true;
            onLikesChanged();
          }, listenError("incoming"))
        );

        S.unsub.push(
          onSnapshot(query(collection(db, C.posts), orderBy("createdAt", "desc"), limit(100)), (snap) => {
            const list = [];
            snap.forEach((d) => list.push({ id: d.id, ...d.data() }));
            S.posts = list;
            if (S.tab === "posts") renderPosts();
            if (S.tab === "admin") renderAdmin();
          }, listenError("posts"))
        );

        if (S.isAdmin) {
          S.unsub.push(
            onSnapshot(collection(db, C.likes), (snap) => {
              const list = [];
              snap.forEach((d) => list.push({ id: d.id, ...d.data() }));
              S.allLikes = list;
              if (S.tab === "admin") renderAdmin();
            }, listenError("admin-likes"))
          );
          S.unsub.push(
            onSnapshot(collection(db, C.private), (snap) => {
              const m = new Map();
              snap.forEach((d) => m.set(d.id, d.data()));
              S.allPrivate = m;
              if (S.tab === "admin") renderAdmin();
            }, listenError("admin-private"))
          );
          S.unsub.push(
            onSnapshot(collection(db, C.reports), (snap) => {
              const list = [];
              snap.forEach((d) => list.push({ id: d.id, ...d.data() }));
              list.sort((a, b) => (b.ts || 0) - (a.ts || 0));
              S.reports = list;
              renderChrome();
              if (S.tab === "admin") renderAdmin();
            }, listenError("admin-reports"))
          );
        }
      }

      function matchUids() {
        const s = new Set();
        S.outgoing.forEach((v, uid) => {
          if (v.type === "like" && S.incoming.get(uid)?.type === "like") s.add(uid);
        });
        return s;
      }

      function onLikesChanged() {
        if (!(S.loaded.out && S.loaded.inc)) return;
        const now = matchUids();
        if (S.knownMatches) {
          for (const uid of now) {
            if (!S.knownMatches.has(uid)) {
              const p = S.profiles.get(uid);
              if (p && !p.banned && myProfile()) {
                openMatch(uid);
                break;
              }
            }
          }
          S.knownMatches.forEach((uid) => { if (!now.has(uid)) S.contactsCache.delete(uid); });
        }
        S.knownMatches = now;
        route();
      }

      /* =====================================================================
         8. МАРШРУТИЗАЦИЯ ЭКРАНОВ
      ===================================================================== */
      function showScreen(id) {
        ["screen-loading", "screen-login", "screen-form", "screen-banned", "screen-main"].forEach((x) => {
          $("#" + x).hidden = x !== id;
        });
        $("#btn-filters").hidden = !(id === "screen-main" && S.tab === "discover");
      }

      function route() {
        if (!S.user) return showScreen("screen-login");
        if (!S.loaded.profiles || !S.loaded.priv) return showScreen("screen-loading");
        const me = myProfile();
        if (me && me.banned && !S.isAdmin) return showScreen("screen-banned");
        if (S.editing || (!me && !S.isAdmin)) {
          if (!S.formOpen) openForm();
          return showScreen("screen-form");
        }
        showScreen("screen-main");
        renderChrome();
        renderTab();
      }

      function renderChrome() {
        $("#admin-badge").hidden = !S.isAdmin;
        $("#nav-admin").hidden = !S.isAdmin;
        $$(".nav-btn").forEach((b) => b.classList.toggle("active", b.dataset.tab === S.tab));
        ["discover", "posts", "likes", "profile", "admin"].forEach((x) => ($("#tab-" + x).hidden = x !== S.tab));
        $("#btn-filters").hidden = !(S.tab === "discover" && !$("#screen-main").hidden);

        const incoming = incomingList().length;
        const badge = $("#badge-likes");
        badge.textContent = incoming;
        badge.hidden = incoming === 0;

        const fc = activeFilterCount();
        $("#filters-count").textContent = fc;
        $("#filters-count").hidden = fc === 0;
      }

      function switchTab(tab) {
        S.tab = tab;

        renderTab(true);
      }

      function renderTab(force = false) {
        if (S.tab === "discover") renderFeed(force);
        if (S.tab === "posts") renderPosts();
        if (S.tab === "likes") renderLikes();
        if (S.tab === "profile") renderProfile();

      function completeness(p, priv) {
        const items = [
          { ok: !!p.photo, w: 20, k: "comp.photo" },
          { ok: !!p.name && p.age >= CONFIG.MIN_AGE, w: 10, k: "comp.nameAge" },
          { ok: (p.goals?.length || p.goals?.size || 0) > 0, w: 10, k: "comp.goals" },
          { ok: !!p.faculty && !!p.course && !!p.group, w: 15, k: "comp.study" },
          { ok: (p.bio || "").length >= 40, w: 15, k: "comp.bio" },
          { ok: (p.skills?.length || p.skills?.size || 0) >= 2, w: 15, k: "comp.skills" },
          { ok: !!(priv?.telegram || priv?.instagram), w: 10, k: "comp.contact" },
          { ok: !!(priv?.telegram && priv?.instagram), w: 5, k: "comp.both" },
        ];
        const percent = items.reduce((s, i) => s + (i.ok ? i.w : 0), 0);
        return { percent, missing: items.filter((i) => !i.ok).map((i) => t(i.k)) };
      }

      function updateFormMeta() {
        const f = readForm();

          { ...f, photo: S.form.photo, goals: S.form.goals, skills: S.form.skills },

        $("#form-progress").style.width = percent + "%";

      async function compressImage(file) {
        const dataUrl = await new Promise((res, rej) => {
          const r = new FileReader();
          r.onload = () => res(r.result);
          r.onerror = rej;
          r.readAsDataURL(file);
        });
        const image = await new Promise((res, rej) => {
          const i = new Image();
          i.onload = () => res(i);
          i.onerror = rej;
          i.src = dataUrl;
        });
        const max = 520;
        let w = image.width, h = image.height;
        if (w > max || h > max) {
          if (w >= h) { h = Math.round((h * max) / w); w = max; }
          else { w = Math.round((w * max) / h); h = max; }
        }
        const canvas = document.createElement("canvas");
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext("2d");
        ctx.fillStyle = "#fff";
        ctx.fillRect(0, 0, w, h);
        ctx.drawImage(image, 0, 0, w, h);
        let q = 0.78, out = canvas.toDataURL("image/jpeg", q);
        while (out.length > 300000 && q > 0.4) {
          q -= 0.08;
          out = canvas.toDataURL("image/jpeg", q);
        }
        return out;
      }

      /* =====================================================================
         10. ЛЕНТА + ФИЛЬТРЫ
      ===================================================================== */
      function sharedGoals(me, p) {
        const mine = new Set(me.goals || []);
        let shared = (p.goals || []).filter((g) => mine.has(g));
        const mutual = prefOk(me.lookingFor, p.gender) && prefOk(p.lookingFor, me.gender);
        if (!mutual) shared = shared.filter((g) => g !== "love");
        return shared;
      }

      function candidates(me) {
        const F = S.filters;
        const mySkills = new Set(me.skills || []);
        const list = [];
        S.profiles.forEach((p) => {
          if (p.uid === S.uid || p.banned === true || S.outgoing.has(p.uid)) return;
          // Кого ищу: если выбран пол, показываем всех людей этого пола, независимо от их целей
          const pref = me.goals?.includes("love") ? me.lookingFor || "any" : "any";
          if (pref !== "any" && p.gender !== pref) return;
          const shared = sharedGoals(me, p);
          if (F.goal !== "all" && !(p.goals || []).includes(F.goal)) return;
          if (F.course !== "all" && p.course !== F.course) return;
          if (F.faculty !== "all" && p.faculty !== F.faculty) return;
          if (F.skills.length && !F.skills.some((s) => (p.skills || []).includes(s))) return;
          const commonSkills = (p.skills || []).filter((s) => mySkills.has(s)).length;
          // люди с общими целями — первыми
          list.push({ p, shared, score: shared.length * 3 + commonSkills });
        });
        list.sort((a, b) => {
          if (a.p.uid === S.undoUid) return -1;
          if (b.p.uid === S.undoUid) return 1;
          return b.score - a.score || (b.p.createdAt || 0) - (a.p.createdAt || 0);
        });
        return list;
      }

      function activeFilterCount() {
        const F = S.filters;
        return (F.goal !== "all") + (F.course !== "all") + (F.faculty !== "all") + (F.skills.length > 0);
      }

      function emptyHtml(em, title, text, buttons = "") {
        return `<div class="empty"><div class="em">${em}</div><h3>${esc(title)}</h3><p>${esc(text)}</p>${buttons}</div>`;
      }

      function renderFeed(force = false) {
        const box = $("#feed-stack");
        const actions = $("#swipe-actions");
        $("#btn-undo").disabled = !S.lastSwipe;
        const me = myProfile();

        if (!me) {
          S.feedSig = "noprofile";
          S.topUid = null;
          actions.classList.add("off");
          box.innerHTML = emptyHtml("👤", t("feed.noProfileTitle"), t("feed.noProfileText"),
            `<button class="btn btn-primary" data-action="edit-profile">${esc(t("btn.createProfile"))}</button>`);
          return;
        }
        if (S.dragging || S.swiping) {
          S.feedDirty = true;
          return;
        }

        const list = candidates(me);
        const top = list[0];
        const sig = top ? `${top.p.uid}:${top.p.updatedAt}:${S.isAdmin}:${top.shared.join()}:${(top.p.goals || []).join()}:${LANG}` : `empty:${activeFilterCount()}:${LANG}`;
        if (!force && sig === S.feedSig) return;
        S.feedSig = sig;
        S.feedDirty = false;

        if (!top) {
          S.topUid = null;
          actions.classList.toggle("off", !S.lastSwipe);
          box.innerHTML = activeFilterCount()
            ? emptyHtml("🔍", t("feed.noneTitle"), t("feed.noneText"),
                `<button class="btn btn-primary" data-action="reset-filters">${esc(t("btn.resetFilters"))}</button>`)
            : emptyHtml("✨", t("feed.allTitle"), t("feed.allText"),
                `<button class="btn btn-primary" data-action="restore-skips">${esc(t("btn.restore"))}</button>`);
          return;
        }

        actions.classList.remove("off");
        const p = top.p;
        S.topUid = p.uid;
        const mySkills = new Set(me.skills || []);
        const adminTools = S.isAdmin
          ? `<button class="glass danger" data-action="admin-ban" data-uid="${esc(p.uid)}" data-ban="true">${esc(t("card.ban"))}</button>`
          : "";

        box.innerHTML = `
          <article class="swipe-card" id="swipe-card" data-uid="${esc(p.uid)}">
            ${img(p, "card-photo")}
            <div class="card-shade"></div>
            <div class="card-top">
              <span class="glass">🎓 ${esc(courseLabel(p.course))} · ${esc(p.group)}</span>
              <div class="card-tools">
                ${adminTools}
                <button class="glass" data-action="report" data-uid="${esc(p.uid)}" title="${esc(t("tip.report"))}">⚑</button>
              </div>
            </div>
            <div class="stamp stamp-like" id="stamp-like">${esc(t("stamp.like"))}</div>
            <div class="stamp stamp-skip" id="stamp-skip">${esc(t("stamp.skip"))}</div>
            <div class="card-info">
              <div class="goal-row">${(p.goals || []).map((g) => goalBadge(g, !top.shared.includes(g))).join("")}</div>
              <h2>${esc(p.name)}, <span>${esc(p.age)}</span></h2>
              <p class="card-sub">${esc(p.faculty)}</p>
              ${p.bio ? `<p class="card-bio">${esc(p.bio)}</p>` : ""}
              <div class="skill-row">${(p.skills || []).map((s) => `<span class="skill-tag ${mySkills.has(s) ? "common" : ""}">${esc(skillLabel(s))}</span>`).join("")}</div>
            </div>
          </article>`;
        attachSwipe($("#swipe-card"));
      }

      function attachSwipe(card) {
        if (!card) return;
        let startX = 0, dx = 0, active = false;
        const like = $("#stamp-like");
        const skip = $("#stamp-skip");

        card.addEventListener("pointerdown", (e) => {
          if (e.target.closest("button")) return;
          active = true;
          S.dragging = true;
          startX = e.clientX;
          dx = 0;
          card.setPointerCapture(e.pointerId);
          card.classList.remove("animating");
        });

        card.addEventListener("pointermove", (e) => {
          if (!active) return;
          dx = e.clientX - startX;
          card.style.transform = `translateX(${dx}px) rotate(${dx * 0.05}deg)`;
          const k = Math.min(Math.abs(dx) / 100, 1);
          like.style.opacity = dx < -15 ? k : 0;
          skip.style.opacity = dx > 15 ? k : 0;
        });

        const end = () => {
          if (!active) return;
          active = false;
          S.dragging = false;
          card.classList.add("animating");
          if (dx < -100) swipe("like");
          else if (dx > 100) swipe("skip");
          else {
            card.style.transform = "";
            like.style.opacity = 0;
            skip.style.opacity = 0;
            if (S.feedDirty) setTimeout(() => renderFeed(), 320);
          }
        };
        card.addEventListener("pointerup", end);
        card.addEventListener("pointercancel", end);
      }

      async function writeLike(toUid, type, message = "") {
        await setDoc(ref.like(S.uid, toUid), {
          fromUid: S.uid,
          toUid,
          type,
          message: String(message || "").slice(0, 200),
          ts: Date.now(),
        });
      }

      function swipe(type, message = "") {
        const uid = S.topUid;
        if (!uid || S.swiping) return;
        S.swiping = true;
        const card = $("#swipe-card");
        if (card) {
          card.classList.add("animating");
          card.style.transform = `translateX(${type === "like" ? -520 : 520}px) rotate(${type === "like" ? -22 : 22}deg)`;
          card.style.opacity = "0";
        }
        if (S.undoUid === uid) S.undoUid = null;
        S.lastSwipe = { uid };

        writeLike(uid, type, message)
          .then(() => {
            if (type === "like" && message && S.incoming.get(uid)?.type !== "like") toast(t("toast.msgSent"));
          })
          .catch((err) => {
            S.lastSwipe = null;
            toast(fbErr(err));
          });

        setTimeout(() => {
          S.swiping = false;
          renderFeed(true);
        }, 300);
      }

      async function undoSwipe() {
        const l = S.lastSwipe;
        if (!l) return;
        S.lastSwipe = null;
        S.undoUid = l.uid;
        $("#btn-undo").disabled = true;
        try {
          await deleteDoc(ref.like(S.uid, l.uid));
          toast(t("toast.undone"));

          toast(fbErr(err));

      async function restoreSkips() {

        if (!skips.length) return toast(t("toast.noSkips"));
        try {
          await Promise.all(skips.map((l) => deleteDoc(ref.likeById(l.id))));
          toast(t("toast.restored", { n: skips.length }));

          toast(fbErr(err));
        }

      function openFilters() {
        S.filterDraft = JSON.parse(JSON.stringify(S.filters));

        openModal("modal-filters");
      }

      function renderFilterSheet() {
        const D = S.filterDraft;

        const skillSet = new Set(SKILL_KEYS);
