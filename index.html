        $("#flt-skills").innerHTML = [...skillSet].slice(0, 40).map((s) => chip("skills", s, skillLabel(s), D.skills.includes(s))).join("");
      }

      $("#flt-faculty").addEventListener("change", (e) => (S.filterDraft.faculty = e.target.value));

      function applyFilters(f) {
        S.filters = f;
        saveFilters();
        closeModal("modal-filters");
        renderChrome();
        renderFeed(true);
      }

      /* =====================================================================
         11. СООБЩЕНИЕ С ЛАЙКОМ, МЭТЧ, ЖАЛОБА
      ===================================================================== */
      function openMessage(uid, { prefill = "", goals = null, kickerKey = "msg.kicker", fromFeed = false } = {}) {
        const me = myProfile();
        const p = S.profiles.get(uid);
        if (!me) return toast(t("toast.needProfile"));
        if (!p) return;
        S.pendingMsg = { uid, fromFeed };
        $("#msg-photo").src = photoOf(p);
        $("#msg-photo").dataset.fallback = p.name;
        $("#msg-name").textContent = `${p.name}, ${p.age}`;
        $("#msg-kicker").textContent = t(kickerKey);
        $("#msg-text").value = prefill;

        const g = goals || sharedGoals(me, p);
        const ice = t("ice");
        const lines = (g.length ? g : ["friends"]).flatMap((k) => ice[k] || []);
        $("#msg-icebreakers").innerHTML = lines
          .map((x) => `<button class="chip" data-action="icebreaker" data-value="${esc(x)}">${esc(x)}</button>`)
          .join("");
        openModal("modal-msg");
        setTimeout(() => $("#msg-text").focus(), 80);
      }

      async function sendMessage() {
        const m = S.pendingMsg;
        if (!m) return;
        const text = $("#msg-text").value.trim();
        closeModal("modal-msg");
        S.pendingMsg = null;
        if (m.fromFeed && m.uid === S.topUid) {
          swipe("like", text);
          return;
        }
        try {
          await writeLike(m.uid, "like", text);
          if (S.incoming.get(m.uid)?.type !== "like") toast(t("toast.respSent"));
        } catch (err) {
          toast(fbErr(err));
        }
      }

      async function loadContacts(uid) {
        if (S.contactsCache.has(uid)) return S.contactsCache.get(uid);
        try {
          const d = await getDoc(ref.priv(uid));
          const c = d.exists() ? d.data() : null;
          S.contactsCache.set(uid, c);
          return c;
        } catch (e) {
          return null;
        }
      }

      function contactsHtml(c) {
        if (!c || (!c.telegram && !c.instagram)) return `<p class="small muted" style="margin:0">${esc(t("contacts.na"))}</p>`;
        let html = "";
        if (c.telegram) {
          html += `<div class="contact-row"><div><small>Telegram</small><b>@${esc(c.telegram)}</b></div>
            <div class="actions"><button class="btn btn-ghost sm" data-action="copy" data-value="@${esc(c.telegram)}">${esc(t("btn.copy"))}</button>
            <a class="btn btn-primary sm" href="https://t.me/${encodeURIComponent(c.telegram)}" target="_blank" rel="noopener noreferrer">${esc(t("btn.write"))}</a></div></div>`;
        }
        if (c.instagram) {
          html += `<div class="contact-row"><div><small>Instagram</small><b>@${esc(c.instagram)}</b></div>
            <div class="actions"><button class="btn btn-ghost sm" data-action="copy" data-value="@${esc(c.instagram)}">${esc(t("btn.copy"))}</button>
            <a class="btn btn-ghost sm" href="https://instagram.com/${encodeURIComponent(c.instagram)}" target="_blank" rel="noopener noreferrer">${esc(t("btn.profileLink"))}</a></div></div>`;
        }
        return html;
      }

      async function openMatch(uid) {
        const me = myProfile();
        const p = S.profiles.get(uid);
        if (!me || !p) return;
        $("#match-me").src = photoOf(me);
        $("#match-them").src = photoOf(p);
        $("#match-name").textContent = `${p.name}, ${p.age} · ${courseLabel(p.course)}`;
        $("#match-goals").innerHTML = sharedGoals(me, p).map(goalBadge).join("");
        const msg = S.incoming.get(uid)?.message || S.outgoing.get(uid)?.message || "";
        $("#match-message").hidden = !msg;
        $("#match-message").textContent = msg ? `💌 «${msg}»` : "";
        $("#match-contacts").innerHTML = `<p class="small muted" style="margin:0">${esc(t("contacts.loading"))}</p>`;
        openModal("modal-match");
        $("#match-contacts").innerHTML = contactsHtml(await loadContacts(uid));
      }

      function openReport(uid) {
        S.pendingReport = { uid };
        S.reportReason = "";
        $("#report-text").value = "";
        $$("#report-reasons .chip").forEach((c) => c.classList.remove("active"));
        openModal("modal-report");
      }

      async function sendReport() {
        const r = S.pendingReport;
        if (!r) return;
        if (!S.reportReason) return toast(t("report.chooseReason"));
        if (!myProfile()) return toast(t("toast.needProfile"));
        const extra = $("#report-text").value.trim();
        const reason = (S.reportReason + (extra ? `: ${extra}` : "")).slice(0, 300);
        closeModal("modal-report");
        S.pendingReport = null;
        try {
          await addDoc(collection(db, C.reports), { fromUid: S.uid, targetUid: r.uid, reason, ts: Date.now() });
          if (r.uid === S.topUid && S.tab === "discover") swipe("skip");
          else await writeLike(r.uid, "skip");
          toast(t("toast.reportSent"));
        } catch (err) {
          toast(fbErr(err));
        }
      }

      /* =====================================================================
         12. ДОСКА «ИЩУ КОМАНДУ»
      ===================================================================== */
      function renderPosts() {
        $("#post-kind-filter").innerHTML =
          `<button class="chip ${S.postKindFilter === "all" ? "active" : ""}" data-action="post-kind" data-value="all">${esc(t("filter.all"))}</button>` +
          Object.keys(POST_KINDS)
            .map((k) => `<button class="chip ${S.postKindFilter === k ? "active" : ""}" data-action="post-kind" data-value="${k}">${esc(kindLabel(k))}</button>`)
            .join("");

        const me = myProfile();
        const mySkills = new Set(me?.skills || []);
        const list = S.posts.filter((post) => {
          const a = S.profiles.get(post.authorUid);
          if (!a || a.banned) return false;
          return S.postKindFilter === "all" || post.kind === S.postKindFilter;
        });

        const box = $("#posts-list");
        if (!list.length) {
          box.innerHTML = `<div class="item">${emptyHtml("💡", t("posts.emptyTitle"), t("posts.emptyText"))}</div>`;
          return;
        }

        const del = (id) => `<button class="btn btn-danger sm" data-action="delete-post" data-id="${esc(id)}">${esc(t("btn.delete"))}</button>`;
        const resp = (id) => `<button class="btn btn-primary sm" data-action="respond-post" data-id="${esc(id)}">${esc(t("btn.respond"))}</button>`;

        box.innerHTML = list
          .map((post) => {
            const a = S.profiles.get(post.authorUid);
            const mine = post.authorUid === S.uid;
            const btn = mine ? del(post.id) : S.isAdmin ? `<div class="actions">${del(post.id)}${resp(post.id)}</div>` : resp(post.id);
            return `
              <article class="item post">
                <div class="post-head"><span class="kind">${esc(kindLabel(post.kind))}</span><span class="tiny muted">${esc(timeAgo(post.createdAt))}</span></div>
                <h3>${esc(post.title)}</h3>
                ${post.text ? `<p class="text">${esc(post.text)}</p>` : ""}
                ${(post.skills || []).length ? `<div class="chips">${post.skills.map((s) => `<span class="chip static ${mySkills.has(s) ? "common" : ""}">${esc(skillLabel(s))}</span>`).join("")}</div>` : ""}
                <div class="post-foot">
                  <div class="person sm">${img(a)}<div class="meta"><h4>${esc(a.name)}</h4><p>${esc(courseLabel(a.course))} · ${esc(a.group)}</p></div></div>
                  ${btn}
                </div>
              </article>`;
          })
          .join("");
      }

      function openNewPost() {
        if (!myProfile()) return toast(t("toast.needProfile"));
        const mine = S.posts.filter((p) => p.authorUid === S.uid).length;
        if (mine >= CONFIG.MAX_POSTS_PER_USER) return toast(t("toast.maxPosts", { n: CONFIG.MAX_POSTS_PER_USER }));
        S.postDraft = { kind: "hackathon", skills: new Set() };
        $("#post-title").value = "";
        $("#post-text").value = "";
        $("#post-text-count").textContent = "0 / 500";
        renderPostDraft();
        openModal("modal-post");
      }

      function renderPostDraft() {
        $("#post-kind").innerHTML = Object.keys(POST_KINDS)
          .map((k) => `<button type="button" class="${S.postDraft.kind === k ? "active" : ""}" data-action="post-draft-kind" data-value="${k}">${esc(kindLabel(k))}</button>`)
          .join("");
        $("#post-skills").innerHTML = SKILL_KEYS.map(
          (s) => `<button type="button" class="chip ${S.postDraft.skills.has(s) ? "active" : ""}" data-action="post-draft-skill" data-value="${esc(s)}">${esc(skillLabel(s))}</button>`
        ).join("");
      }

      $("#post-text").addEventListener("input", (e) => ($("#post-text-count").textContent = `${e.target.value.length} / 500`));

      async function publishPost() {
        const title = $("#post-title").value.trim();
        const text = $("#post-text").value.trim();
        if (title.length < 3) return toast(t("val.postTitle"));
        try {
          await addDoc(collection(db, C.posts), {
            authorUid: S.uid,
            kind: S.postDraft.kind,
            title: title.slice(0, 70),
            text: text.slice(0, 500),
            skills: [...S.postDraft.skills].slice(0, 8),
            createdAt: Date.now(),
          });
          closeModal("modal-post");
          toast(t("toast.posted"));
        } catch (err) {
          toast(fbErr(err));
        }
      }

      function respondPost(id) {
        const post = S.posts.find((p) => p.id === id);
        if (!post) return;
        if (matchUids().has(post.authorUid)) return toast(t("toast.alreadyMatch"));
        const goals = post.kind === "study" ? ["study"] : ["team"];
        openMessage(post.authorUid, { prefill: `📌 «${post.title}»: `, goals, kickerKey: "msg.kickerPost" });
      }

      /* =====================================================================
         13. СИМПАТИИ И МЭТЧИ
      ===================================================================== */
      function incomingList() {
        const list = [];
        S.incoming.forEach((l, uid) => {
          if (l.type !== "like" || S.outgoing.has(uid)) return;
          const p = S.profiles.get(uid);
          if (p && !p.banned) list.push({ p, l });
        });
        return list.sort((a, b) => (b.l.ts || 0) - (a.l.ts || 0));
      }

      function renderLikes() {
        const me = myProfile();
        const inc = incomingList();
        $("#incoming-count").textContent = inc.length;
        $("#incoming-list").innerHTML = inc.length
          ? inc
              .map(({ p, l }) => {
                const g = me ? sharedGoals(me, p) : [];
                return `
                <div class="item">
                  <div class="person">${img(p)}<div class="meta">
                    <h4>${esc(p.name)}, ${esc(p.age)}</h4>
                    <p>${esc(courseLabel(p.course))} · ${esc(p.group)} · ${esc(p.faculty)}</p>
                    <div class="goal-row" style="margin-top:6px">${g.map(goalBadge).join("")}</div>
                  </div></div>
                  ${p.bio ? `<p class="small muted" style="margin:0">${esc(p.bio)}</p>` : ""}
                  ${l.message ? `<div class="bubble">💌 ${esc(l.message)}</div>` : ""}
                  <div class="actions">
                    <button class="btn btn-ghost" data-action="reject" data-uid="${esc(p.uid)}">${esc(t("btn.reject"))}</button>
                    <button class="btn btn-primary grow" data-action="accept" data-uid="${esc(p.uid)}">${esc(t("btn.accept"))}</button>
                  </div>
                </div>`;
              })
              .join("")
          : `<div class="item"><p class="small muted text-center" style="margin:6px 0">${esc(t("likes.noneIn"))}</p></div>`;

        const lastTs = (uid) => Math.max(S.incoming.get(uid)?.ts || 0, S.outgoing.get(uid)?.ts || 0);
        const matches = [...matchUids()]
          .map((uid) => S.profiles.get(uid))
          .filter((p) => p && !p.banned)
          .sort((a, b) => lastTs(b.uid) - lastTs(a.uid));
        $("#matches-count").textContent = matches.length;
        $("#matches-list").innerHTML = matches.length
          ? matches
              .map((p) => {
                const msg = S.incoming.get(p.uid)?.message || S.outgoing.get(p.uid)?.message || "";
                return `
                <div class="item">
                  <div class="person">${img(p)}<div class="meta">
                    <h4>${esc(p.name)}, ${esc(p.age)}</h4>
                    <p>${esc(courseLabel(p.course))} · ${esc(p.group)}</p>
                  </div>
                  <button class="btn-link" data-action="unmatch" data-uid="${esc(p.uid)}">${esc(t("btn.unmatch"))}</button></div>
                  ${msg ? `<div class="bubble">💌 ${esc(msg)}</div>` : ""}
                  <div class="contacts" data-contacts="${esc(p.uid)}"><p class="small muted" style="margin:0">${esc(t("contacts.loading"))}</p></div>
                </div>`;
              })
              .join("")
          : `<div class="item"><p class="small muted text-center" style="margin:6px 0">${esc(t("likes.noneMatch"))}</p></div>`;

        $$("[data-contacts]").forEach(async (el) => {
          el.innerHTML = contactsHtml(await loadContacts(el.dataset.contacts));
        });
      }

      /* =====================================================================
         14. ПРОФИЛЬ
      ===================================================================== */
      function renderProfile() {
        const box = $("#profile-content");
        const me = myProfile();
        const uidLine = `<div class="item uid-line"><span>${esc(t("profile.yourId"))} <code>${esc(S.uid)}</code></span><button class="btn btn-ghost sm" data-action="copy" data-value="${esc(S.uid)}">${esc(t("btn.copy"))}</button></div>`;

        if (!me) {
          box.innerHTML = `
            <div class="item">${emptyHtml("👤", t("profile.noneTitle"), t("profile.noneText"),
              `<button class="btn btn-primary" data-action="edit-profile">${esc(t("btn.createProfile"))}</button>`)}</div>
            ${uidLine}
            <button class="btn btn-ghost full" data-action="logout">${esc(t("btn.logout"))}</button>`;
          return;
        }

        const { percent, missing } = completeness(me, S.myPrivate);
        const pv = S.myPrivate || {};
        box.innerHTML = `
          <div class="profile-card">
            ${img(me, "card-photo")}
            <div class="card-shade"></div>
            <div class="card-top"><span class="glass">🎓 ${esc(courseLabel(me.course))} · ${esc(me.group)}</span></div>
            <div class="card-info">
              <div class="goal-row">${(me.goals || []).map(goalBadge).join("")}</div>
              <h2>${esc(me.name)}, <span>${esc(me.age)}</span></h2>
              <p class="card-sub">${esc(me.faculty)}</p>
              ${me.bio ? `<p class="card-bio">${esc(me.bio)}</p>` : ""}
              <div class="skill-row">${(me.skills || []).map((s) => `<span class="skill-tag">${esc(skillLabel(s))}</span>`).join("")}</div>
            </div>
          </div>

          <div class="item">
            <div class="section-head"><b>${esc(t("comp.title"))}</b><span class="count">${percent}%</span></div>
            <div class="progress"><div class="progress-bar" style="width:${percent}%"></div></div>
            ${missing.length
              ? `<p class="tiny muted" style="margin:2px 0 0">${esc(t("comp.hint"))}</p>
                 <div class="checklist">${missing.map((m) => `<button data-action="edit-profile">＋ ${esc(m)}</button>`).join("")}</div>`
              : `<p class="small" style="margin:0;color:var(--ok)">${esc(t("comp.done"))}</p>`}
          </div>

          <div class="item">
            <b class="small">${esc(t("profile.contacts"))} <span class="muted">${esc(t("profile.contactsHint"))}</span></b>
            <div class="chips">
              ${pv.telegram ? `<span class="chip static">Telegram: @${esc(pv.telegram)}</span>` : ""}
              ${pv.instagram ? `<span class="chip static">Instagram: @${esc(pv.instagram)}</span>` : ""}
              ${!pv.telegram && !pv.instagram ? `<span class="small muted">${esc(t("profile.noContacts"))}</span>` : ""}
            </div>
          </div>

          <button class="btn btn-primary full" data-action="edit-profile">${esc(t("btn.edit"))}</button>
          <div class="actions">
            <button class="btn btn-ghost grow" data-action="logout">${esc(t("btn.logout"))}</button>
            <button class="btn btn-danger grow" data-action="delete-account">${esc(t("btn.deleteAcc"))}</button>
          </div>
          ${uidLine}`;
      }

      async function deleteMyAccount() {
        try {
          const ops = [];
          S.outgoing.forEach((l) => ops.push(deleteDoc(ref.likeById(l.id))));
          S.incoming.forEach((l) => ops.push(deleteDoc(ref.likeById(l.id))));
          S.posts.filter((p) => p.authorUid === S.uid).forEach((p) => ops.push(deleteDoc(ref.post(p.id))));
          ops.push(deleteDoc(ref.priv(S.uid)));
          await Promise.all(ops);
          await deleteDoc(ref.profile(S.uid));
          toast(t("toast.accDeleted"));
          await signOut(auth);
        } catch (err) {
          toast(fbErr(err));
        }
      }

      /* =====================================================================
         15. АДМИН-ПАНЕЛЬ
      ===================================================================== */
      $("#admin-search").addEventListener("input", (e) => {
        S.adminQuery = e.target.value.trim().toLowerCase();
        renderAdmin();
      });

      function renderAdmin() {
        if (!S.isAdmin) return;
        const profiles = [...S.profiles.values()].sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
        const banned = profiles.filter((p) => p.banned).length;

        const likeSet = new Set(S.allLikes.filter((l) => l.type === "like").map((l) => `${l.fromUid}>${l.toUid}`));
        const pairs = new Set();
        S.allLikes.forEach((l) => {
          if (l.type === "like" && likeSet.has(`${l.toUid}>${l.fromUid}`)) pairs.add([l.fromUid, l.toUid].sort().join("_"));
        });

        const stat = (v, key) => `<div class="stat"><b>${v}</b><span>${esc(t(key))}</span></div>`;
        $("#admin-stats").innerHTML =
          stat(profiles.length, "admin.statProfiles") + stat(banned, "admin.statBan") + stat(pairs.size, "admin.statMatches") +
          stat(S.reports.length, "admin.statReports") + stat(S.posts.length, "admin.statPosts");

        $("#reports-count").textContent = S.reports.length;
        $("#admin-reports").innerHTML = S.reports.length
          ? S.reports
              .map((r) => {
                const tg = S.profiles.get(r.targetUid);
                const from = S.profiles.get(r.fromUid);
                return `
                <div class="item ${tg?.banned ? "banned" : ""}">
                  <div class="person sm">${img(tg || { name: "?" })}<div class="meta">
                    <h4>${tg ? esc(tg.name) + ", " + esc(tg.age) : esc(t("admin.deleted"))}</h4>
                    <p>${esc(t("admin.reportFrom", { name: from?.name || t("admin.unknown"), time: timeAgo(r.ts) }))}</p>
                  </div></div>
                  <div class="bubble">⚑ ${esc(reasonLabel(r.reason))}</div>
                  ${tg ? `<div class="contacts">${contactsHtml(S.allPrivate.get(tg.uid))}</div>` : ""}
                  <div class="actions">
                    <button class="btn btn-ghost grow" data-action="dismiss-report" data-id="${esc(r.id)}">${esc(t("btn.dismiss"))}</button>
                    ${tg && !tg.banned ? `<button class="btn btn-danger grow" data-action="admin-ban" data-uid="${esc(tg.uid)}" data-ban="true" data-report="${esc(r.id)}">${esc(t("btn.ban"))}</button>` : ""}
                  </div>
                </div>`;
              })
              .join("")
          : `<div class="item"><p class="small muted text-center" style="margin:4px 0">${esc(t("admin.noReports"))}</p></div>`;

        const q = S.adminQuery;
        const filtered = profiles.filter((p) => {
          if (S.adminFilter === "active" && p.banned) return false;
          if (S.adminFilter === "banned" && !p.banned) return false;
          const pv = S.allPrivate.get(p.uid) || {};
          if (q && !`${p.name} ${p.group} ${p.faculty} ${p.course} ${pv.telegram || ""} ${pv.instagram || ""}`.toLowerCase().includes(q)) return false;
          return true;
        });
        $("#admin-users").innerHTML = filtered.length
          ? filtered
              .map((p) => {
                const rc = S.reports.filter((r) => r.targetUid === p.uid).length;
                return `
                <div class="item ${p.banned ? "banned" : ""}">
                  <div class="person">${img(p)}<div class="meta">
                    <h4>${esc(p.name)}, ${esc(p.age)} ${p.banned ? "· ⛔" : ""}</h4>
                    <p>${esc(courseLabel(p.course))} · ${esc(p.group)} · ${esc(p.faculty)}</p>
                    <p>${esc(t("admin.goals"))} ${(p.goals || []).map((g) => GOAL_EMOJI[g] || "").join(" ")} ${rc ? `· <span style="color:var(--danger)">${esc(t("admin.reportsN", { n: rc }))}</span>` : ""}</p>
                  </div></div>
                  ${p.bio ? `<p class="small muted" style="margin:0">${esc(p.bio)}</p>` : ""}
                  <div class="contacts">${contactsHtml(S.allPrivate.get(p.uid))}</div>
                  <div class="actions">
                    ${p.uid === S.uid ? `<span class="small muted">${esc(t("admin.you"))}</span>` : `
                    <button class="btn ${p.banned ? "btn-ok" : "btn-ghost"} grow" data-action="admin-ban" data-uid="${esc(p.uid)}" data-ban="${!p.banned}">${esc(p.banned ? t("btn.unban") : t("btn.banIcon"))}</button>
                    <button class="btn btn-danger" data-action="admin-delete" data-uid="${esc(p.uid)}">${esc(t("btn.delete"))}</button>`}
                  </div>
                </div>`;
              })
              .join("")
          : `<div class="item"><p class="small muted text-center" style="margin:4px 0">${esc(t("admin.nobody"))}</p></div>`;
      }

      async function adminSetBan(uid, ban, reportId) {
        try {
          await updateDoc(ref.profile(uid), { banned: ban, updatedAt: Date.now() });
          if (reportId) await deleteDoc(ref.report(reportId)).catch(() => {});
          toast(ban ? t("toast.banned") : t("toast.unbanned"));
        } catch (err) {
          toast(fbErr(err));
        }
      }

      async function adminDeleteUser(uid) {
        try {
          const ops = [];
          S.allLikes.filter((l) => l.fromUid === uid || l.toUid === uid).forEach((l) => ops.push(deleteDoc(ref.likeById(l.id))));
          S.posts.filter((p) => p.authorUid === uid).forEach((p) => ops.push(deleteDoc(ref.post(p.id))));
          S.reports.filter((r) => r.targetUid === uid).forEach((r) => ops.push(deleteDoc(ref.report(r.id))));
          ops.push(deleteDoc(ref.priv(uid)));
          await Promise.all(ops);
          await deleteDoc(ref.profile(uid));
          toast(t("toast.userDeleted"));
        } catch (err) {
          toast(fbErr(err));
        }
      }

      /* =====================================================================
         16. ЕДИНЫЙ ОБРАБОТЧИК КЛИКОВ
      ===================================================================== */
      const ACTIONS = {
        "login": () => login(),
        "logout": () => signOut(auth),
        "toggle-theme": () => setTheme(document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark"),
        "cycle-lang": () => setLang(LANGS[(LANGS.indexOf(LANG) + 1) % LANGS.length]),
        "set-lang": (el) => setLang(el.dataset.value),
        "tab": (el) => switchTab(el.dataset.tab),
        "close-modal": (el) => closeModal(el.dataset.modal),

        "edit-profile": () => { S.editing = true; S.formOpen = false; route(); },
        "cancel-form": () => closeForm(),
        "toggle-skill": (el) => {
          const v = el.dataset.value;
          if (S.form.skills.has(v)) S.form.skills.delete(v);
          else if (S.form.skills.size >= 10) return toast(t("toast.maxSkills"));
          else S.form.skills.add(v);
          renderFormSkills();
          updateFormMeta();
        },
        "add-skill": () => addCustomSkill(),

        "like": () => swipe("like"),
        "skip": () => swipe("skip"),
        "msg-like": () => S.topUid && openMessage(S.topUid, { fromFeed: true }),
        "undo": () => undoSwipe(),
        "restore-skips": () => restoreSkips(),
        "report": (el) => openReport(el.dataset.uid),
        "open-filters": () => openFilters(),
        "flt": (el) => {
          const { group, value } = el.dataset;
          const D = S.filterDraft;
          if (group === "skills") {
            D.skills = D.skills.includes(value) ? D.skills.filter((s) => s !== value) : [...D.skills, value];
          } else {
            D[group] = value;
          }
          renderFilterSheet();
        },
        "apply-filters": () => applyFilters(S.filterDraft),
        "reset-filters": () => applyFilters({ goal: "all", course: "all", faculty: "all", skills: [] }),

        "icebreaker": (el) => {
          const ta = $("#msg-text");
          const m = ta.value.match(/^📌 «.*?»: /s);
          ta.value = (m ? m[0] : "") + el.dataset.value;
        },
        "send-msg": () => sendMessage(),
        "report-reason": (el) => {
          S.reportReason = el.dataset.value;
          $$("#report-reasons .chip").forEach((c) => c.classList.toggle("active", c === el));
        },
        "send-report": () => sendReport(),

        "accept": (el) => writeLike(el.dataset.uid, "like").catch((e) => toast(fbErr(e))),
        "reject": (el) => writeLike(el.dataset.uid, "skip").then(() => toast(t("toast.skipped"))).catch((e) => toast(fbErr(e))),
        "unmatch": (el) =>
          askConfirm(t("confirm.unmatchTitle"), t("confirm.unmatchText"), t("confirm.unmatchOk"), () =>
            writeLike(el.dataset.uid, "skip").catch((e) => toast(fbErr(e)))
          ),
        "copy": (el) => copyText(el.dataset.value),

        "post-kind": (el) => { S.postKindFilter = el.dataset.value; renderPosts(); },
        "new-post": () => openNewPost(),
        "post-draft-kind": (el) => { S.postDraft.kind = el.dataset.value; renderPostDraft(); },
        "post-draft-skill": (el) => {
          const v = el.dataset.value;
          if (S.postDraft.skills.has(v)) S.postDraft.skills.delete(v);
          else if (S.postDraft.skills.size >= 8) return toast(t("toast.maxPostSkills"));
          else S.postDraft.skills.add(v);
          renderPostDraft();
        },
        "publish-post": () => publishPost(),
        "respond-post": (el) => respondPost(el.dataset.id),
        "delete-post": (el) =>
          askConfirm(t("confirm.delPostTitle"), t("confirm.delPostText"), t("btn.delete"), () =>
            deleteDoc(ref.post(el.dataset.id)).then(() => toast(t("toast.deleted"))).catch((e) => toast(fbErr(e)))
          ),

        "delete-account": () =>
          askConfirm(t("confirm.delAccTitle"), t("confirm.delAccText"), t("confirm.delAccOk"), deleteMyAccount),
        "confirm-ok": () => {
          const fn = S.confirmFn;
          S.confirmFn = null;
          closeModal("modal-confirm");
          if (fn) fn();
        },

        "admin-filter": (el) => {
          S.adminFilter = el.dataset.value;
          $$("#admin-filter .chip").forEach((c) => c.classList.toggle("active", c === el));
          renderAdmin();
        },
        "admin-ban": (el) => adminSetBan(el.dataset.uid, el.dataset.ban === "true", el.dataset.report),
        "admin-delete": (el) => {
          const p = S.profiles.get(el.dataset.uid);
          askConfirm(t("confirm.adminDelTitle", { name: p?.name || "?" }), t("confirm.adminDelText"), t("btn.delete"), () =>
            adminDeleteUser(el.dataset.uid)
          );
        },
        "dismiss-report": (el) => deleteDoc(ref.report(el.dataset.id)).then(() => toast(t("toast.dismissed"))).catch((e) => toast(fbErr(e))),
      };

      document.addEventListener("click", (e) => {
        if (e.target.classList?.contains("modal")) {
          e.target.hidden = true;
          return;
        }
        const el = e.target.closest("[data-action]");
        if (el && ACTIONS[el.dataset.action]) ACTIONS[el.dataset.action](el, e);

        const single = e.target.closest("[data-single] button");
        if (single) {
          S.form[single.parentElement.dataset.single] = single.dataset.value;
          syncFormPills();
          updateFormMeta();
        }
        const multi = e.target.closest("[data-multi] button");
        if (multi) {
          const v = multi.dataset.value;
          S.form.goals.has(v) ? S.form.goals.delete(v) : S.form.goals.add(v);
          syncFormPills();
          updateFormMeta();
        }
      });

      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") $$(".modal").forEach((m) => (m.hidden = true));
        const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName || "");
        if (typing || S.tab !== "discover" || $("#screen-main").hidden || $$(".modal").some((m) => !m.hidden)) return;
        if (e.key === "ArrowLeft") swipe("like");
        if (e.key === "ArrowRight") swipe("skip");
      });

      /* =====================================================================
         17. СТАРТ
      ===================================================================== */
      $("#brand-name").textContent = CONFIG.APP_NAME;
      buildFormStatic();
      applyStaticI18n();
    </script>
  </body>
</html>
